name: Tenant Isolation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**/*.php'
      - 'Modules/**/*.php'
      - 'database/migrations/**/*.php'
  push:
    branches: [main]
    paths:
      - 'app/**/*.php'
      - 'Modules/**/*.php'
      - 'database/migrations/**/*.php'

jobs:
  check-database-columns:
    name: Check DB client columns
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexora_check
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tenant isolation checks
        env:
          DB_URL: postgresql://nexora:nexora_check@127.0.0.1:5432/nexora_check
          HR_DB_URL: postgresql://nexora:nexora_check@127.0.0.1:5432/nexora_check
          INVENTORY_DB_URL: postgresql://nexora:nexora_check@127.0.0.1:5432/nexora_check
          PROCUREMENT_DB_URL: postgresql://nexora:nexora_check@127.0.0.1:5432/nexora_check
          ORDER_FULFILLMENT_DB_URL: postgresql://nexora:nexora_check@127.0.0.1:5432/nexora_check
          ECOMMERCE_DB_URL: postgresql://nexora:nexora_check@127.0.0.1:5432/nexora_check
          MANUFACTURING_DB_URL: postgresql://nexora:nexora_check@127.0.0.1:5432/nexora_check
          FINANCE_DB_URL: postgresql://nexora:nexora_check@127.0.0.1:5432/nexora_check
          BUSINESS_INTELLIGENCE_DB_URL: postgresql://nexora:nexora_check@127.0.0.1:5432/nexora_check
        run: |
          php artisan tenant:check-isolation --format=github

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Static analysis — unfiltered queries
        env:
          DB_URL: ''  # prevent connection attempts
        run: |
          php artisan tenant:check-isolation --code-only --format=github

      - name: PHP syntax lint
        run: |
          ! find app/ Modules/ -name '*.php' -not -path '*/vendor/*' -exec php -l {} \; 2>/dev/null | grep -v 'No syntax errors detected' | grep .
