<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="circle" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="100" fill="url(#bg)"/>
  
  <!-- Subtle outer ring -->
  <circle cx="100" cy="100" r="95" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="78" rx="28" ry="30" fill="url(#circle)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="160" rx="46" ry="40" fill="url(#circle)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- User icon silhouette -->
  <circle cx="100" cy="70" r="22" fill="rgba(255,255,255,0.15)"/>
  <ellipse cx="100" cy="130" rx="40" ry="28" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Camera icon overlay (subtle) -->
  <g transform="translate(130, 145)" opacity="0.3">
    <rect x="0" y="4" width="20" height="16" rx="4" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <circle cx="10" cy="12" r="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="6" y="0" width="8" height="4" rx="1" fill="rgba(255,255,255,0.3)"/>
  </g>
</svg>
